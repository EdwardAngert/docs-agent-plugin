# Docs-assist documentation linting workflow.
# Install as: .github/workflows/docs-lint.yml
#
# Assumes setup-lint has copied these per-tool configs to the repo root:
#   .markdownlint.jsonc        (markdownlint-cli2 rules)
#   .markdownlint-cli2.jsonc   (markdownlint-cli2 scope: extends the file
#                              above, adds the globs, so a bare `npx
#                              markdownlint-cli2` matches this workflow)
#   .vale.ini  + styles/       (Vale)
#   cspell.json                (cspell)
#   .markdown-link-check.json  (markdown-link-check)
#
# Each tool runs as a separate step so failures are easy to read. All Node
# tooling runs via npx (no global installs). The job fails on lint errors.

name: Docs Lint

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"

permissions:
  contents: read

jobs:
  docs-lint:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Structural markdown rules. Scope comes from .markdownlint-cli2.jsonc
      # (generated by setup-lint), not hardcoded here, so there is one
      # definition of what gets linted, not one in this workflow and a
      # different one in the config a contributor runs locally.
      - name: markdownlint
        if: always()
        run: npx --yes markdownlint-cli2

      # Vale never fetches the Google, write-good, and alex packages .vale.ini
      # declares on its own; only `vale sync` does, and only its LSP mode runs
      # that automatically. Sync explicitly first, via the npm-wrapped CLI so
      # no separate binary install is needed.
      - name: vale sync
        if: always()
        run: npx --yes @vvago/vale sync

      # Prose style. Uses the official Vale action.
      # NOTE: errata-ai was renamed to vale-cli; errata-ai/vale-action@v2 still
      # resolves. Swap to vale-cli/vale-action@v2 if the redirect is ever dropped.
      # npx fallback (no action): npx --yes @vvago/vale --glob='*.{md,mdx}' .
      # --minAlertLevel=error makes Vale emit only error-level findings, so the
      # job fails on those and not on warnings. reviewdog reports at info level
      # and would otherwise fail the build on any warning-level prose finding.
      - name: Vale
        if: always()
        uses: errata-ai/vale-action@v2
        with:
          version: latest
          files: .
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter
          vale_flags: "--glob=*.{md,mdx} --minAlertLevel=error"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Correct spelling.
      - name: cspell
        if: always()
        run: npx --yes cspell --no-progress --config cspell.json "**/*.md" "**/*.mdx"

      # Valid links.
      - name: markdown-link-check
        if: always()
        run: |
          shopt -s globstar nullglob
          files=( **/*.md **/*.mdx )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Markdown files to check."
            exit 0
          fi
          npx --yes markdown-link-check \
            --config .markdown-link-check.json \
            --quiet \
            "${files[@]}"
