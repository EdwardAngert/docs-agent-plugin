# Docs Assist docs-impact check.
#
# Installed by /docs-assist:setup-hooks (ci). Runs the deterministic
# docs-impact detector on every pull request: it classifies the diff against
# the change types that ripple into documentation (moved docs, changed
# headings, changed code terms the docs mention, large silent source changes)
# and writes the result to the job summary.
#
# Cheap by design: no agent, no network calls beyond GitHub itself, no
# tokens. It tells reviewers when to run /docs-assist:update; it does not
# run it. Set DOCS_IMPACT_STRICT: "1" to fail the check instead of only
# reporting.
#
# The result is posted as a single sticky PR comment, updated in place on
# every push, so re-runs never pile up new comments.

name: Docs impact

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-impact:
    name: Detect documentation impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect docs impact
        run: node scripts/docs-impact.mjs "origin/${{ github.base_ref }}"
        env:
          DOCS_IMPACT_STRICT: "0"
          DOCS_IMPACT_REPORT_FILE: docs-impact-report.md
      # continue-on-error: fork PRs get a read-only token, so the comment
      # post fails there; the report still lands in the job summary above.
      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('docs-impact-report.md')) return;
            const marker = '<!-- docs-assist:docs-impact -->';
            const body = marker + '\n' + fs.readFileSync('docs-impact-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
