# Docs Assist template catalog: The Good Docs Project.
#
# This is an index, not the templates themselves. It lets the plugin suggest a
# template from what the contributor is trying to write, then fetch the body
# live only when they pick one. Bodies are never vendored here.
#
# Source: The Good Docs Project templates, https://gitlab.com/tgdp/templates
# License: MIT No Attribution (MIT-0). See THIRD-PARTY-NOTICES.md.
# Verified against ref `main` on 2026-07-01.
#
# Each entry maps a Good Docs template to:
#   content_type  one of the canonical Docs Assist types (the default decision axis)
#   seven_action  the user need it serves (Ferri Benedetti's seven-action model)
#   signals       phrases in a request that hint at this template, used to suggest it
#   template_url  the fillable skeleton fetched when the contributor picks it
#   guide_url     the Good Docs guide on how to fill that skeleton, read for coaching

source:
  name: The Good Docs Project
  repo: https://gitlab.com/tgdp/templates
  ref: main
  license: MIT-0
  attribution: "Based on a template from The Good Docs Project (https://thegooddocsproject.dev/)."

templates:
  - id: troubleshooting
    title: Troubleshooting
    description: "Diagnose and resolve a specific problem, one entry per failure mode."
    content_type: troubleshooting
    seven_action: troubleshoot
    signals:
      - "people keep opening tickets about"
      - "same error keeps coming up"
      - "how do I fix"
      - "this keeps breaking"
      - "recurring issue"
    template_url: https://gitlab.com/tgdp/templates/-/raw/main/troubleshooting/template_troubleshooting.md
    guide_url: https://gitlab.com/tgdp/templates/-/raw/main/troubleshooting/guide_troubleshooting.md

  - id: how-to
    title: How-to
    description: "Steps to complete one well-defined task."
    content_type: doc
    seven_action: practice
    signals:
      - "how to"
      - "steps to"
      - "walk through"
      - "set up"
    template_url: https://gitlab.com/tgdp/templates/-/raw/main/how-to/template_how-to.md
    guide_url: https://gitlab.com/tgdp/templates/-/raw/main/how-to/guide_how-to.md

