extends: existence
message: "'%s' weakens the instruction. Remove it or be specific about what to do."
link: https://developers.google.com/style/tone
level: warning
ignorecase: true
# "just" is deliberately excluded: it is common, ordinary English in a
# restrictive or contrastive sense ("not just X", "just enough", "just
# describing") far more often than it is the weakening sense ("just click
# the button"). A bare-word existence match cannot tell the two apart, and
# the ordinary sense is common enough that banning the word outright creates
# more noise than it catches. Same lesson as "leverage" in MarketingLanguage.yml.
tokens:
  - simply
  - easily
  - obviously
  - basically
  - of course
  - as you can see
