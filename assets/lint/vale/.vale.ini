# Docs Assist Vale configuration.
#
# Scaffolded by `/docs-assist:setup-lint` from .docs-assist/config.yml.
# General prose quality is a managed problem, not something this plugin
# maintains its own copy of: Google, write-good, and alex are Vale's own
# style packages, actively maintained upstream, covering weasel words,
# passive voice, wordiness, clichés, heading and punctuation conventions,
# and inclusive language. `vale sync` downloads them.
#
# The DocsAssist style is deliberately small: only what those packages do
# not cover; AI voice (hedging, marketing language, false-contrast framing,
# throat-clearing openers) and this plugin's own opinionated defaults (no em
# dashes, descriptive link text, imperative headings). See the comments
# below for the two places a project's own config.yml settings should
# override a package rule that would otherwise fight the project's choice.
#
# Spelling is left to cspell to avoid duplicate noise.

StylesPath = styles
MinAlertLevel = suggestion
Packages = Google, write-good, alex

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good, alex, DocsAssist

# cspell owns spelling.
Vale.Spelling = NO

# Google.Headings assumes sentence case, which matches config.yml's own
# default, so it stays enabled here. Set it to NO when a project's
# heading_case is "title" instead, so it does not flag every AP-title-cased
# heading in the project.
Google.Headings = YES

# Google.EmDash is a formatting check (spacing, character), not a ban.
# DocsAssist.EmDash already bans em dashes outright when no_em_dashes is
# true, so disable Google's softer rule to avoid a duplicate, confusing
# finding on the same em dash. Re-enable it when no_em_dashes is false: it
# is still useful for projects that allow em dashes but want them formatted
# correctly.
Google.EmDash = NO
