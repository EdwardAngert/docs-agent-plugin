# Docs Assist Vale configuration.
#
# Scaffolded by `/docs-assist:setup-lint` from .docs-assist/config.yml.
# The DocsAssist style encodes the plugin's prose rules. Vale's built-in style
# adds repetition and consistency checks. Spelling is left to cspell to avoid
# duplicate noise.

StylesPath = styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, DocsAssist

# cspell owns spelling.
Vale.Spelling = NO
