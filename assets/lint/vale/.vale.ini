# Docs Assist Vale configuration.
#
# Scaffolded by `/docs-assist:setup-lint` from .docs-assist/config.yml.
# General prose quality is a managed problem, not something this plugin
# maintains its own copy of: Google, write-good, and alex are Vale's own
# style packages, actively maintained upstream, covering weasel words,
# passive voice, wordiness, clichés, heading and punctuation conventions,
# and inclusive language. `vale sync` downloads them.
#
# The DocsAssist style is deliberately small: only what those packages do
# not cover; AI voice (hedging, marketing language, false-contrast framing,
# throat-clearing openers) and this plugin's own opinionated defaults (no em
# dashes, descriptive link text, imperative headings). See the comments
# below both for the places a project's own config.yml settings should
# override a package rule that would otherwise fight the project's choice,
# and for the rules disabled outright because they fought this plugin's own
# established conventions rather than catching a real issue.
#
# Spelling is left to cspell to avoid duplicate noise.

StylesPath = styles
MinAlertLevel = suggestion
Packages = Google, write-good, alex

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good, alex, DocsAssist

# cspell owns spelling.
Vale.Spelling = NO

# Google.Headings assumes sentence case, which matches config.yml's own
# default, so it stays enabled here. Set it to NO when a project's
# heading_case is "title" instead, so it does not flag every AP-title-cased
# heading in the project.
Google.Headings = YES

# Google.EmDash is a formatting check (spacing, character), not a ban.
# DocsAssist.EmDash already bans em dashes outright when no_em_dashes is
# true, so disable Google's softer rule to avoid a duplicate, confusing
# finding on the same em dash. Re-enable it when no_em_dashes is false: it
# is still useful for projects that allow em dashes but want them formatted
# correctly.
Google.EmDash = NO

# Google.Quotes enforces American style (commas and periods always inside
# quotation marks). Disabled: this plugin's own docs quote exact terms and
# values ("sign in", not "log in") where the punctuation is genuinely outside
# the quoted string, not part of it, the same reasoning most technical
# writing guides use for quoting a literal. Re-enable for a project whose
# prose quotes speech or long phrases rather than literal terms.
Google.Quotes = NO

# Google.Units expects a nonbreaking space between a number and a unit
# (4 km, not 4km). It also fires on section references that only look like a
# number-plus-letter pair ("section 4d"), which is not a unit at all and has
# no fix that doesn't misrepresent the citation. Disabled project-wide rather
# than fought one false positive at a time; re-enable for a project whose
# docs are heavy on real units of measurement.
Google.Units = NO

# alex.Condescending flags words like "obvious," "easy," and "clearly" by
# existence, the same bare-word blind spot as DocsAssist's own retired
# Weasel.just: none of this plugin's own uses are actually condescending
# toward a reader (they describe findings, accessibility, or quote the
# phrase as an example of a failure mode, not commit it). Disabled; alex's
# other inclusive-language rules stay on.
alex.Condescending = NO
