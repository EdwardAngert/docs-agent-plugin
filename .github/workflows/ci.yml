# Docs Assist CI.
# Validates the plugin's structure and dogfoods the linters it ships against its
# own documentation. If the plugin cannot pass its own rules, the build fails.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifests, references, and frontmatter
        run: node scripts/validate.mjs

  dogfood:
    name: Lint own docs with shipped config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Structural rules, using the markdownlint config this plugin ships.
      - name: markdownlint (own docs)
        if: always()
        run: >
          npx --yes markdownlint-cli2
          --config assets/lint/markdownlint/.markdownlint.jsonc
          "README.md" "CHANGELOG.md" "docs/**/*.md"

      # Vale never fetches Packages (Google, write-good, alex) on its own;
      # only `vale sync` does, and only its LSP mode runs that automatically.
      # The action below does not either, so sync explicitly first.
      # NOTE: the npm-wrapped @vvago/vale CLI was tried here first and does
      # not reliably resolve on a fresh npx install (works from a prior
      # global install, not a clean npx run); downloading the real release
      # binary via `gh release download` is what's actually verified to work.
      - name: vale sync (fetch Google, write-good, alex)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo vale-cli/vale --pattern '*Linux_64-bit.tar.gz' --output vale.tar.gz --clobber
          tar -xzf vale.tar.gz vale
          ./vale sync --config=assets/lint/vale/.vale.ini
          rm -f vale vale.tar.gz

      # Prose rules, using the Vale DocsAssist style this plugin ships, plus
      # the managed Google, write-good, and alex packages synced above.
      # Lints all of the plugin's own markdown. The action's `files` input takes a
      # single path, so scan the repo root and let .vale.ini scope to markdown.
      # `--minAlertLevel=error` makes Vale emit only error-level findings (em
      # dashes), so the job fails on those and not on warnings. reviewdog reports
      # at info level and would otherwise fail the PR on any warning in the diff.
      - name: Vale (own docs)
        if: always()
        uses: errata-ai/vale-action@v2
        with:
          version: latest
          files: "."
          vale_flags: "--config=assets/lint/vale/.vale.ini --minAlertLevel=error"
          fail_on_error: true
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Spelling, using this repo's own word list (.cspell.json), separate
      # from the generic template this plugin ships at assets/lint/cspell/.
      - name: cspell (own docs)
        if: always()
        run: npx --yes cspell --no-progress --config .cspell.json "**/*.md" ".docs-assist/**"
